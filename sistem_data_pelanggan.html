
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Data Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4 text-center">Sistem Data Pelanggan</h1>
    <form id="dataForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="datetime-local" name="tarikh" class="p-2 border rounded" required>
      <input type="text" name="namaPelanggan" placeholder="Nama Pelanggan" class="p-2 border rounded" required>
      <input type="text" name="namaSyarikat" placeholder="Nama Syarikat" class="p-2 border rounded">
      <input type="text" name="kaedah" placeholder="Kaedah (telefon, emel, hadir, dll.)" class="p-2 border rounded">
      <input type="text" name="telefonEmel" placeholder="No. Telefon / Emel" class="p-2 border rounded">
      <input type="text" name="tempoh" placeholder="Tempoh Maklum Balas Selesai" class="p-2 border rounded">
      <input type="text" name="pegawai" placeholder="Pegawai Bertanggungjawab" class="p-2 border rounded">
      <textarea name="isu" placeholder="Perkara / Isu / Pertanyaan & Jawapan" class="p-2 border rounded col-span-1 md:col-span-2" required></textarea>
      <button type="submit" class="bg-blue-600 text-white p-2 rounded col-span-1 md:col-span-2">Hantar</button>
    </form>

    <div id="dataList" class="mt-6 space-y-4">
      <h2 class="text-xl font-semibold">Senarai Data Pelanggan</h2>
    </div>
  </div>

  <script>
    const form = document.getElementById('dataForm');
    const dataList = document.getElementById('dataList');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(form);
      const entry = document.createElement('div');
      entry.className = 'bg-gray-50 border rounded p-4';

      entry.innerHTML = `
        <p><strong>Tarikh & Masa:</strong> ${formData.get('tarikh')}</p>
        <p><strong>Nama Pelanggan:</strong> ${formData.get('namaPelanggan')}</p>
        <p><strong>Nama Syarikat:</strong> ${formData.get('namaSyarikat')}</p>
        <p><strong>Kaedah:</strong> ${formData.get('kaedah')}</p>
        <p><strong>No. Telefon / Emel:</strong> ${formData.get('telefonEmel')}</p>
        <p><strong>Tempoh Maklum Balas Selesai:</strong> ${formData.get('tempoh')}</p>
        <p><strong>Pegawai:</strong> ${formData.get('pegawai')}</p>
        <p><strong>Perkara / Isu / Pertanyaan & Jawapan:</strong><br>${formData.get('isu')}</p>
      `;

      dataList.appendChild(entry);
      form.reset();
    });
  </script>
</body>
</html>
